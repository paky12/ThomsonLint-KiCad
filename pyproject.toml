[project]
name = "thomsonlint-kicad"
version = "0.1.0"
description = "KiCad exporter for ThomsonLint AI hardware design review"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
thomsonlint = "kicad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kicad"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
